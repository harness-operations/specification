name: Comparison data

on:
  pull_request:
    paths:
      - 'comparisons/**'
      - 'mappings/**'
      - '.github/workflows/comparisons.yml'
  push:
    branches:
      - main
    paths:
      - 'comparisons/**'
      - 'mappings/**'
      - '.github/workflows/comparisons.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4.23,<5'

      - name: Validate comparison data
        run: python comparisons/validate.py
