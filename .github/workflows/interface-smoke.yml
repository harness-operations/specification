name: Harness interface smoke

on:
  pull_request:
    paths:
      - 'tests/interface-smoke.*'
      - 'comparisons/data/systems.json'
      - '.github/workflows/interface-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'tests/interface-smoke.*'
      - 'comparisons/data/systems.json'
      - '.github/workflows/interface-smoke.yml'

permissions:
  contents: read

jobs:
  exact-version-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run exact-version interface smoke tests
        run: bash tests/interface-smoke.sh
