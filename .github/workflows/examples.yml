name: Examples

on:
  pull_request:
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'
  push:
    branches:
      - main
    paths:
      - 'examples/**'
      - '.github/workflows/examples.yml'

permissions:
  contents: read

jobs:
  approved-artifact-handoff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/approved-artifact-handoff
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fixture tests
        run: python -m unittest -v

      - name: Run deterministic demo
        run: python demo.py
