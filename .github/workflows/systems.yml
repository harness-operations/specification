name: Systems reference

on:
  pull_request:
    paths:
      - 'systems/**'
      - 'tests/systems/**'
      - '.github/workflows/systems.yml'
  push:
    branches:
      - main
    paths:
      - 'systems/**'
      - 'tests/systems/**'
      - '.github/workflows/systems.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'jsonschema>=4.23,<5'
      - run: python systems/validate.py
